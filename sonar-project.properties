# SonarQube Configuration for Prateek's Tutoring Website
sonar.projectKey=prateek-tutoring-website
sonar.projectName=Prateek's Tutoring Website
sonar.projectVersion=1.0.0

# Source code location
sonar.sources=.

# Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/*.min.js,\
  **/*.min.css,\
  **/coverage/**,\
  **/dist/**,\
  **/build/**,\
  **/.github/**,\
  **/.git/**,\
  **/og-image.png,\
  **/.editorconfig,\
  **/.gitignore,\
  **/.gitattributes,\
  **/.codespellignore,\
  **/.htmlhintrc,\
  **/.markdownlint.yaml,\
  **/.pre-commit-config.yaml,\
  **/.prettierrc,\
  **/.stylelintrc.json,\
  **/eslint.config.js

# Source file encoding
sonar.sourceEncoding=UTF-8

# JavaScript/CSS settings
sonar.javascript.file.suffixes=.js
sonar.css.file.suffixes=.css

# Test and coverage
sonar.test.inclusions=**/*.test.js,**/*.spec.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info
